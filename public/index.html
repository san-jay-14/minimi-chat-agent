<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimi chat agent</title>
<style>
  :root { --bg:#fafaf8; --fg:#1c1c1a; --muted:#6b6b66; --line:#deded8; --card:#fff; --me:#eceae3; --accent:#2c5fd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ecece8; --muted:#9a9a93; --line:#33332f; --card:#1f1f1d; --me:#2a2a27; --accent:#7ea2ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:6px 12px; }
  button:disabled { opacity:.5; cursor:default; }
  #log { flex:1; overflow-y:auto; padding:16px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin:0 0 16px; }
  .me { background:var(--me); border-radius:10px; padding:8px 12px; white-space:pre-wrap; margin-left:auto; max-width:85%; width:fit-content; }
  .bot p, .bot ul { margin:0 0 8px; }
  .bot table { border-collapse:collapse; margin:8px 0; font-size:14px; display:block; overflow-x:auto; }
  .bot th, .bot td { border:1px solid var(--line); padding:4px 8px; text-align:left; vertical-align:top; }
  .bot a { color:var(--accent); }
  .err { color:#c0392b; }
  .sources { font-size:13px; color:var(--muted); margin-top:6px; }
  .sources div { margin:2px 0; }
  #status { min-height:22px; padding:0 16px; color:var(--muted); font-size:14px; max-width:820px; width:100%; margin:0 auto; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; font:inherit; resize:none; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--card); color:var(--fg); }
</style>
</head>
<body>
<header><h1>Minimi chat agent</h1><button id="new" type="button">New chat</button></header>
<main id="log" aria-live="polite"></main>
<div id="status"></div>
<form id="form">
  <textarea id="input" rows="2" placeholder="Ask something. Enter to send, Shift+Enter for a new line." autofocus></textarea>
  <button id="send">Send</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
const store = (k, make) => { try { return localStorage.getItem(k) || (localStorage[k] = make()); } catch { return make(); } };
const userId = store("minimi_user", () => crypto.randomUUID());   // memory is keyed by this, across chats
let sessionId = crypto.randomUUID();                              // one per "New chat"

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Small markdown subset: bold, code, bullet lists, tables, paragraphs. [R3] links to its source.
function render(text, sources) {
  const byId = Object.fromEntries((sources || []).map((s) => [s.id, s]));
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/\[(R\d+)\]/g, (m, id) => byId[id] ? `<a href="${esc(byId[id].url)}" target="_blank" rel="noopener">[${id}]</a>` : m);
  const out = []; let list = [], table = [];
  const flush = () => {
    if (list.length) out.push("<ul>" + list.map((x) => `<li>${inline(x)}</li>`).join("") + "</ul>"), list = [];
    if (table.length) {
      const rows = table.filter((r) => !/^\|[\s:|-]+\|?$/.test(r)).map((r) => r.replace(/^\||\|$/g, "").split("|"));
      out.push("<table>" + rows.map((r, i) => "<tr>" + r.map((c) => `<${i ? "td" : "th"}>${inline(c.trim())}</${i ? "td" : "th"}>`).join("") + "</tr>").join("") + "</table>");
      table = [];
    }
  };
  for (const line of text.split("\n")) {
    if (/^\s*\|/.test(line)) { if (list.length) flush(); table.push(line.trim()); }
    else if (/^\s*[-*] /.test(line)) { if (table.length) flush(); list.push(line.replace(/^\s*[-*] /, "")); }
    else { flush(); if (line.trim()) out.push(`<p>${inline(line)}</p>`); }
  }
  flush();
  return out.join("");
}

function add(cls, html) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = html;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

async function ask(message) {
  add("me", esc(message));
  const bot = add("bot", "");
  let text = "", sources = [];
  const show = () => { bot.innerHTML = render(text, sources); $("log").scrollTop = $("log").scrollHeight; };
  $("send").disabled = true;
  $("status").textContent = "Sending…";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id: userId, session_id: sessionId, message,
        client_time: new Date().toISOString(),
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);

    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.search(/\r?\n\r?\n/)) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i).replace(/^\r?\n\r?\n/, "");
        const event = /^event: (.*)$/m.exec(frame)?.[1];
        const data = JSON.parse(frame.split(/\r?\n/).filter((l) => l.startsWith("data: ")).map((l) => l.slice(6)).join("\n") || "null");
        if (event === "status") $("status").textContent = data.text;
        else if (event === "token") { text += data.text; show(); }
        else if (event === "sources") {
          sources = data; show();
          if (sources.length) bot.insertAdjacentHTML("beforeend", '<div class="sources">' + sources.map((s) =>
            `<div>[${s.id}] <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>${s.published ? " · " + esc(s.published) : ""}${s.read_live_at ? " · read live " + esc(s.read_live_at.slice(0, 16).replace("T", " ")) + " UTC" : ""}</div>`).join("") + "</div>");
        }
        else if (event === "error") bot.insertAdjacentHTML("beforeend", `<p class="err">${esc(data.message)}</p>`);
      }
    }
  } catch (e) {
    bot.insertAdjacentHTML("beforeend", `<p class="err">${esc(String(e.message || e))}</p>`);
  } finally {
    $("status").textContent = "";
    $("send").disabled = false;
    $("input").focus();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const m = $("input").value.trim();
  if (!m || $("send").disabled) return;
  $("input").value = "";
  ask(m);
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("new").addEventListener("click", () => { sessionId = crypto.randomUUID(); $("log").innerHTML = ""; $("status").textContent = ""; $("input").focus(); });
</script>
</body>
</html>
