<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>Minimi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%234f46e5'/%3E%3Cpath d='M7 16.5V8l5 5 5-5v8.5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#input">Skip to the message box</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 24 24">
    <rect width="24" height="24" rx="7" fill="var(--accent)"/>
    <path d="M7 16.5V8l5 5 5-5v8.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<header class="top">
  <h1 class="brand"><svg class="mark" aria-hidden="true"><use href="#mark"/></svg><span>Minimi</span></h1>
  <button id="new" type="button" class="ghost">New chat</button>
</header>

<div class="scroll-wrap">
<main id="scroll" class="scroll" tabindex="0" aria-label="Conversation">
  <div class="column">
    <section id="empty" class="empty">
      <svg class="mark big" aria-hidden="true"><use href="#mark"/></svg>
      <h2>What should I check?</h2>
      <p>I search the web, remember what you asked before, and tell you what changed since.</p>
      <div id="examples" class="examples">
        <button type="button" class="example">On Monday we shortlisted 5 CRM tools for a 20-person sales team. Has any of them changed pricing or shipped something big since?</button>
        <button type="button" class="example">What did I ask you on 3 November? Is your answer still correct today?</button>
        <button type="button" class="example">Last Tuesday I asked you about Postgres hosting. Has any pricing changed since then?</button>
      </div>
    </section>
    <div id="log" class="log"></div>
  </div>
</main>
<button id="jump" type="button" class="jump" hidden aria-label="Jump to the latest message">&darr; Latest</button>
</div>

<div class="composer">
  <div id="status" class="sr-only" role="status" aria-live="polite"></div>
  <form id="form" class="column" aria-label="Send a message">
    <label for="input" class="sr-only">Message</label>
    <textarea id="input" rows="1" placeholder="Ask a question" title="Enter sends, Shift+Enter adds a line" autofocus></textarea>
    <button id="send" type="submit" aria-label="Send message" disabled>Send</button>
  </form>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
